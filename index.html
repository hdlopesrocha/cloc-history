<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Turn any Git repository into a language-aware history of its size. Count every commit, filter languages, and export charts or CSV."
    />
    <meta name="theme-color" content="#08100d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>cloc/history · codebase archaeology</title>
    <script>
      (() => {
        try {
          const stored = JSON.parse(localStorage.getItem('cloc-history:theme') || 'null');
          const theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f4f1e8' : '#08100d');
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
